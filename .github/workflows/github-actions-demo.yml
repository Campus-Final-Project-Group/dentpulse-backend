name: Backend CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build WAR file
        run: mvn clean package -DskipTests -Dmaven.artifact.threads=1

      - name: Stop and Deep Clean Tomcat
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Tomcat nawaththala iwara wenakan thappara 5k inna
            sudo systemctl stop tomcat || true
            sleep 5
            
            # 2. Parana files saha CACHE okkoma ain karanna
            sudo rm -rf /opt/tomcat/webapps/dentpulse-backend-0.0.1-SNAPSHOT* || true
            sudo rm -rf /opt/tomcat/work/Catalina/localhost/dentpulse-backend* || true
            sudo rm -rf /opt/tomcat/temp/* || true

      - name: Deploy WAR to EC2
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.EC2_HOST }}
          REMOTE_USER: ${{ secrets.EC2_USER }}
          SOURCE: target/dentpulse-backend-0.0.1-SNAPSHOT.war
          TARGET: /opt/tomcat/webapps
          ARGS: "-rlgoDzvc"

      - name: Start and Force Sync
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Permissions fix karanna
            sudo chown ubuntu:ubuntu /opt/tomcat/webapps/dentpulse-backend-0.0.1-SNAPSHOT.war
            sudo chmod 644 /opt/tomcat/webapps/dentpulse-backend-0.0.1-SNAPSHOT.war
            
            # 2. Tomcat start karanna
            sudo systemctl start tomcat
            
            # 3. WAR eka extract wenakan (Deep extract) thappara 20k inna
            echo "Waiting for deep extraction..."
            sleep 20
            
            # 4. Extract wechcha folder eka thiyeda balanna
            ls -ld /opt/tomcat/webapps/dentpulse-backend-0.0.1-SNAPSHOT || echo "Folder not ready yet"
name: Backend CI/CD

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build WAR
        # Build එකේදී file name එක කෙටි කරගන්න පුළුවන් නම් වඩාත් හොඳයි
        run: mvn clean package -DskipTests -Dmaven.artifact.threads=1

      - name: Preparation & Cleanup
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Tomcat stop කර පරණ දත්ත අයින් කිරීම
            sudo systemctl stop tomcat || true
            sudo rm -rf /opt/tomcat/webapps/dentpulse-backend-0.0.1-SNAPSHOT
            sudo rm -rf /opt/tomcat/work/Catalina/localhost/dentpulse-backend-0.0.1-SNAPSHOT
            # RAM නිදහස් කිරීම
            sudo sync && echo 3 | sudo tee /proc/sys/vm/drop_caches

      - name: Transfer WAR
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.EC2_HOST }}
          REMOTE_USER: ${{ secrets.EC2_USER }}
          SOURCE: "target/dentpulse-backend-0.0.1-SNAPSHOT.war"
          TARGET: "/opt/tomcat/webapps"

      - name: Set Permissions & Start
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Permissions හරියටම ලබා දීම (මෙය manual දැමීමේදී මෙන් ක්‍රියා කරයි)
            sudo chown ubuntu:ubuntu /opt/tomcat/webapps/dentpulse-backend-0.0.1-SNAPSHOT.war
            sudo chmod 644 /opt/tomcat/webapps/dentpulse-backend-0.0.1-SNAPSHOT.war
            
            # Tomcat පණ ගැන්වීම
            sudo systemctl start tomcat
            
            # Application එක extract වන තෙක් රැඳී සිටීම
            echo "Waiting for extraction..."
            sleep 40
            
            # Deployment එක සාර්ථක දැයි පරීක්ෂා කිරීම
            if [ -d "/opt/tomcat/webapps/dentpulse-backend-0.0.1-SNAPSHOT" ]; then
                echo "✅ Deployment Successful!"
            else
                echo "❌ Extraction Failed. Checking logs..."
                tail -n 50 /opt/tomcat/logs/catalina.out
                exit 1
            fi
name: Backend CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build WAR file
        run: mvn clean package -DskipTests

      - name: Stop Tomcat and clean old app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Stop Tomcat
            sudo systemctl stop tomcat || true
            
            # 2. Parana files okkoma path karanna
            sudo rm -rf /opt/tomcat/webapps/dentpulse-backend-0.0.1-SNAPSHOT
            sudo rm -f /opt/tomcat/webapps/dentpulse-backend-0.0.1-SNAPSHOT.war

      - name: Deploy WAR to EC2 Tomcat
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.EC2_HOST }}
          REMOTE_USER: ${{ secrets.EC2_USER }}
          # Target eke thiyena original war eka kelinma gannawa
          SOURCE: target/dentpulse-backend-0.0.1-SNAPSHOT.war
          TARGET: /opt/tomcat/webapps
          ARGS: "-rlgoDzvc"

      - name: Fix Permissions and Start Tomcat
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. File ownership hariyata hadanna
            sudo chown ubuntu:ubuntu /opt/tomcat/webapps/dentpulse-backend-0.0.1-SNAPSHOT.war
            sudo chmod 644 /opt/tomcat/webapps/dentpulse-backend-0.0.1-SNAPSHOT.war
            
            # 2. Tomcat start karanna. Start weddi Tomcat eka auto-unzip karagani
            sudo systemctl start tomcat

      - name: Verify Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Waiting for Tomcat to extract the WAR file..."
            sleep 10
            ls -l /opt/tomcat/webapps/
            sudo systemctl status tomcat | grep Active
name: Backend CI/CD

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build WAR
        # RAM ගැටලු මඟහරවා ගැනීමට threads සීමා කර ඇත
        run: mvn clean package -DskipTests -Dmaven.artifact.threads=1

      - name: Safe Clean & Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. RAM එක නිදහස් කිරීමට Tomcat නවත්වා තත්පර 10ක් ඉන්න
            sudo systemctl stop tomcat || true
            sleep 10
            
            # 2. පරණ folders එකින් එක මකන්න (එකවර මැකීම RAM එකට බරකි)
            sudo rm -rf /opt/tomcat/webapps/dentpulse-backend*
            sleep 2
            sudo rm -rf /opt/tomcat/work/Catalina/localhost/dentpulse-backend*
            sleep 2
            sudo rm -rf /opt/tomcat/temp/*
            
            # 3. RAM එක පිරිසිදු කිරීමට cache එක flush කරන්න
            sudo sync && echo 3 | sudo tee /proc/sys/vm/drop_caches

      - name: Transfer WAR
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.EC2_HOST }}
          REMOTE_USER: ${{ secrets.EC2_USER }}
          SOURCE: "target/dentpulse-backend-0.0.1-SNAPSHOT.war"
          TARGET: "/opt/tomcat/webapps"

      - name: Start & Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo chown ubuntu:ubuntu /opt/tomcat/webapps/dentpulse-backend-0.0.1-SNAPSHOT.war
            sudo systemctl start tomcat
            # පද්ධතිය පණ ගැන්වෙන තෙක් තත්පර 45ක් රැඳී සිටින්න
            echo "Waiting for app to extract and start..."
            sleep 45
            # API එක වැඩදැයි පරීක්ෂා කිරීම
            ls -ld /opt/tomcat/webapps/dentpulse-backend-0.0.1-SNAPSHOT || echo "Deployment check failed"
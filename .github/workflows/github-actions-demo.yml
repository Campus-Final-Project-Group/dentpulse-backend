name: Backend CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build WAR file
        run: mvn clean package -DskipTests

      - name: Rename WAR to ROOT.war
        run: cp target/*.war target/ROOT.war

      - name: Stop Tomcat and clean old app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Tomcat nawathwala parana folder okkoma path karanna
            sudo systemctl stop tomcat || true
            sudo rm -rf /opt/tomcat/webapps/ROOT
            sudo rm -f /opt/tomcat/webapps/ROOT.war
            sudo rm -rf /opt/tomcat/webapps/dentpulse-backend*

      - name: Deploy ROOT.war to EC2 Tomcat
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.EC2_HOST }}
          REMOTE_USER: ${{ secrets.EC2_USER }}
          SOURCE: target/ROOT.war
          TARGET: /opt/tomcat/webapps
          ARGS: "-rlgoDzvc"

      - name: Start Tomcat & Fix Permissions
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # ROOT.war eka tomcat user ta ayithi karanna
            sudo chown tomcat:tomcat /opt/tomcat/webapps/ROOT.war
            sudo chmod 644 /opt/tomcat/webapps/ROOT.war
            sudo systemctl start tomcat
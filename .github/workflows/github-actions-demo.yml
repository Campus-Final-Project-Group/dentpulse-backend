name: Backend CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build WAR file
        # RAM ඉතිරි කර ගැනීමට සහ build එක speed කිරීමට threads සීමා කර ඇත
        run: mvn clean package -DskipTests -Dmaven.artifact.threads=1

      - name: Clean Old Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Tomcat නවත්වන්න
            sudo systemctl stop tomcat || true
            
            # පරණ war එක සහ folder එක සම්පූර්ණයෙන්ම අයින් කරන්න
            sudo rm -rf /opt/tomcat/webapps/dentpulse-backend-0.0.1-SNAPSHOT* || true
            
            # Tomcat cache folders clean කරන්න
            sudo rm -rf /opt/tomcat/work/Catalina/localhost/dentpulse-backend* || true

      - name: Deploy WAR to EC2
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.EC2_HOST }}
          REMOTE_USER: ${{ secrets.EC2_USER }}
          SOURCE: target/dentpulse-backend-0.0.1-SNAPSHOT.war
          TARGET: /opt/tomcat/webapps
          ARGS: "-rlgoDzvc"

      - name: Start Tomcat and Verify
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Permissions නිවැරදි කරන්න
            sudo chown ubuntu:ubuntu /opt/tomcat/webapps/dentpulse-backend-0.0.1-SNAPSHOT.war
            sudo chmod 644 /opt/tomcat/webapps/dentpulse-backend-0.0.1-SNAPSHOT.war
            
            # Tomcat නැවත පණගන්වන්න (මෙහිදී WAR එක auto-extract වේ)
            sudo systemctl start tomcat
            
            # පද්ධතිය පණගැන්වෙන තෙක් තත්පර 15ක් රැඳී සිටින්න
            echo "Waiting for Tomcat to extract the WAR file..."
            sleep 15
            
            # සාර්ථකව extract වී ඇත්දැයි පරීක්ෂා කරන්න
            ls -l /opt/tomcat/webapps/ | grep dentpulse
            sudo systemctl status tomcat | grep Active
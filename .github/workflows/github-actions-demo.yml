name: Backend CI/CD

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build WAR
        run: mvn clean package -DskipTests -Dmaven.artifact.threads=1

      - name: Hard Clean Tomcat
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl stop tomcat || true
            sudo pkill -9 -f tomcat || true
            sleep 5
            # Parana folders saha temp files okkoma ain karanna
            sudo rm -rf /opt/tomcat/webapps/dentpulse-backend*
            sudo rm -rf /opt/tomcat/work/Catalina/localhost/dentpulse-backend*
            sudo rm -rf /opt/tomcat/temp/*

      - name: Deploy WAR
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.EC2_HOST }}
          REMOTE_USER: ${{ secrets.EC2_USER }}
          SOURCE: "target/dentpulse-backend-0.0.1-SNAPSHOT.war"
          TARGET: "/opt/tomcat/webapps"

      - name: Start and Verify
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo chown ubuntu:ubuntu /opt/tomcat/webapps/dentpulse-backend-0.0.1-SNAPSHOT.war
            sudo systemctl start tomcat
            # WAR එක extract වී API එක පණ ගැන්වෙන තෙක් කාලය ලබා දෙන්න
            echo "Waiting 40 seconds for full deployment..."
            sleep 40
            # සාර්ථකව extract වී ඇත්දැයි පරීක්ෂාව
            ls -ld /opt/tomcat/webapps/dentpulse-backend-0.0.1-SNAPSHOT || echo "FAILED: Extraction not finished"
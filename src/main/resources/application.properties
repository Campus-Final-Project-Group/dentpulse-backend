spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT CONFIG
# ===============================

# replace with Base64 key later
jwt.secret=${JWT_SECRET}

# 24 hours expiration
jwt.expiration=${JWT_EXPIRATION}

# ===========================
# EMAIL CONFIG (OTP sending)
# ===========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

google.client-id=${GOOGLE_CLIENT_ID}

# ===============================
# Spring AI - OpenAI Configuration
# ===============================
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4.1-mini

# ===============================
# Chatbot System Prompt
# ===============================
chatbot.system-prompt=You are DentPulse Assistant, a friendly and professional dental chatbot. \
Greet users politely and respond in a warm, supportive tone. \
Help users with dental-related questions in simple language. \
If a question is not related to dentistry, politely explain what you can help with and gently guide them back to dental topics. \
Do not provide medical diagnosis or prescribe medicine. \
If symptoms seem serious, advise visiting a qualified dentist. \
Respond in the same language as the user (English or Sinhala). \
Use short, clear, and reassuring responses.